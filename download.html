<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixando Comprovante...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #1a2a6c, #2c4c9e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            color: white;
            text-align: center;
        }
        .download-container {
            max-width: 400px;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin-bottom: 10px; }
        p { opacity: 0.9; margin-bottom: 30px; }
        .comprovante-preview {
            background: white;
            border-radius: 30px;
            padding: 30px;
            margin: 20px 0;
            color: #1a2a6c;
            opacity: 0;
            position: absolute;
            left: -9999px;
        }
        .btn-manual {
            background: white;
            color: #1a2a6c;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="download-container">
        <div class="loading-spinner"></div>
        <h2>Gerando seu comprovante...</h2>
        <p id="statusMessage">Aguarde um momento</p>
        
        <div id="manualDownload" style="display: none;">
            <button class="btn-manual" onclick="baixarManual()">
                ⬇️ Clique para baixar
            </button>
        </div>
    </div>

    <!-- Comprovante oculto para gerar imagem -->
    <div id="comprovanteOculto" class="comprovante-preview">
        <div style="text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 10px;" id="previewIcone">🎫</div>
            <div style="font-size: 1.2rem; color: #5a6a8c; letter-spacing: 3px; margin-bottom: 20px;">COMPROVANTE DIGITAL</div>
            <div style="background: linear-gradient(135deg, #1a2a6c, #2c4c9e); border-radius: 30px; padding: 30px; color: white; margin-bottom: 20px;">
                <div style="font-size: 5rem; font-weight: 800; margin-bottom: 10px;" id="previewNumero">---</div>
                <div style="font-size: 1.5rem; padding: 8px 25px; border-radius: 50px; display: inline-block; background: rgba(255,255,255,0.2);" id="previewCategoria">---</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div style="background: #f0f4fa; padding: 15px; border-radius: 20px;">
                    <div style="font-size: 0.7rem; color: #5a6a8c;">DATA</div>
                    <div style="font-size: 1.2rem; font-weight: 700;" id="previewData"></div>
                </div>
                <div style="background: #f0f4fa; padding: 15px; border-radius: 20px;">
                    <div style="font-size: 0.7rem; color: #5a6a8c;">HORÁRIO</div>
                    <div style="font-size: 1.2rem; font-weight: 700;" id="previewHora"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const numero = params.get('numero') || 'G001';
        const categoria = params.get('categoria') || 'Geral';
        const cor = params.get('cor') || '#3498db';
        const icone = params.get('icone') || '🎫';
        
        console.log('📥 Gerando comprovante para:', numero, categoria);
        
        // Preencher preview
        document.getElementById('previewIcone').textContent = icone;
        document.getElementById('previewNumero').textContent = numero;
        document.getElementById('previewCategoria').textContent = categoria;
        document.getElementById('previewCategoria').style.backgroundColor = cor;
        
        const agora = new Date();
        document.getElementById('previewData').textContent = agora.toLocaleDateString('pt-BR');
        document.getElementById('previewHora').textContent = agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        
        // Função para baixar
        async function baixarComprovante() {
            const element = document.getElementById('comprovanteOculto');
            
            try {
                const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff' });
                
                // Criar link e baixar
                const link = document.createElement('a');
                link.download = `senha-${numero}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                document.getElementById('statusMessage').textContent = '✅ Comprovante baixado!';
                document.querySelector('.loading-spinner').style.display = 'none';
                
                // Fechar a aba após 2 segundos (opcional)
                setTimeout(() => { window.close(); }, 2000);
                
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('statusMessage').textContent = 'Toque no botão abaixo para baixar';
                document.getElementById('manualDownload').style.display = 'block';
                document.querySelector('.loading-spinner').style.display = 'none';
            }
        }
        
        function baixarManual() {
            baixarComprovante();
        }
        
        // Tentar baixar automaticamente
        window.onload = () => {
            setTimeout(baixarComprovante, 500);
        };
    </script>
</body>
</html>
